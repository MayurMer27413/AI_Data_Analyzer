services:
  - type: web
    name: ai-data-analyzer
    env: python
    buildCommand: "apt-get update && apt-get install -y libcairo2-dev pkg-config python3-dev && pip install -r requirements.txt"
    startCommand: "streamlit run app.py --server.port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
